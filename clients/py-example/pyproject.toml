[project]
name = "tzun-example"
version = "0.1.0"
description = "Minimal Python tzun-sdk example."
requires-python = ">=3.11"
dependencies = ["tzun-sdk >= 0.8.2"]
# PyPI refuses any upload that carries this classifier.
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tzun_example"]
