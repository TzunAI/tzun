# Dependency update surveillance.
#
# Every ecosystem is checked monthly, which keeps version-update pull requests
# few; each one runs the full CI matrix. The schedule governs version updates
# only: Dependabot security updates, where enabled in the repository settings,
# open when an advisory lands regardless of it, and ci.yml's `pnpm audit` step
# turns a new HIGH advisory red on the next run either way.
#
# At most five version-update pull requests are open per ecosystem, and none
# for npm until its pull requests can pass the frozen install (#5). They are
# held to the same checks as any other pull request, public hygiene among
# them. Each Dependabot commit is signed off with an address that the hygiene
# check allows only in a commit Dependabot authored
# (scripts/check-public-hygiene.sh).
version: 2
updates:
  # npm / pnpm workspace (root + packages/* + clients/*)
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    # 0 until Dependabot's regenerated pnpm-lock.yaml keeps pnpm.overrides (#5).
    open-pull-requests-limit: 0
    groups:
      dev-dependencies:
        dependency-type: development

  # Python SDK
  - package-ecosystem: pip
    directory: '/python'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  # GitHub Actions. Every `uses:` is pinned to a commit SHA
  # (tests/ts/workflow-supply-chain.test.ts). Dependabot understands SHA pins
  # with a `# vX.Y.Z` comment and bumps both the SHA and the comment together,
  # so pinning does not mean going stale.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
